name: run_worker
type: custom
description: >-
  Internal. Validates the isolated Git worktree recorded on Started, then runs
  the work, Prepare, or Evaluate agent pinned by that fact — resuming the
  session it names, or falling back to a fresh one with a Restarted fact when
  the resume is rejected — records the worker's Rome session (Opened) as soon as
  it exists, and writes what came back (Returned or Failed) to the ledger on the
  worker's behalf, then triggers a reconcile. The runtime
  dispatches this detached; nothing else should call it.
entry: ./index.ts
complexity: complex
speed: slow
reliability: medium
sideEffects: write
