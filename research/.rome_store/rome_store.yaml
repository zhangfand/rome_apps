title: Research
description: Long-running research topics that remember every conversation, source and note.
long_description: |
  Research gives each long-running question its own home. Start a conversation from a topic and the
  agent picks up where you left off. Every chat is archived with a running summary and full transcript,
  and links, PDFs, code and images are saved with notes on why they matter. Everything lives as plain
  files you can open anywhere.
