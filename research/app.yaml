formatVersion: 2
id: research
name: Research
version: 0.1.0
description: >-
  Long-running research workspace. Each topic is a plain-file folder under the
  `research/` project (TOPIC.md living brief, timeline, conversations with full
  transcripts and running summaries, sources of any type, notes). Chats started
  from a topic resume with its accumulated context, and every turn is archived
  automatically.
tagline: 长期研究不丢上下文：对话、资料、笔记都沉淀在一个课题里
icon: assets/icon.svg
appRoot: dist
includeSource: true

web:
  manifest: web/manifest.json
  displayName: Research
  navLabel: Research

api:
  entry: api/index

agents:
  - agents/researcher.yaml

actions:
  - actions/research_list_topics
  - actions/research_create_topic
  - actions/research_get_context
  - actions/research_save_source
  - actions/research_update_source
  - actions/research_save_note
  - actions/research_update_brief
  - actions/research_search

hooks:
  - hooks/agent-turn-finished
