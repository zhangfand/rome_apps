formatVersion: 2
id: conductor
name: Conductor
icon: assets/icon.svg
version: 0.1.0
description: >-
  A long-running task runner whose workflow is a prompt, not a state machine.
  A person or a labeled GitHub issue opens a task; an orchestrator agent reads
  the task's append-only ledger together with an SOP and decides the next step
  — dispatch a worker, ask, report, wait, or close. Workers, people and
  external events all write to the same ledger. Swap the SOP to run a
  different kind of work.
appRoot: dist
includeSource: true

web:
  manifest: web/manifest.json
  displayName: Conductor
  navLabel: Conductor

api:
  entry: app/api/index

db:
  migrations: core/db/migrations
  tablePrefix: conductor

agents:
  - app/agents/conductor.yaml
  - app/agents/orchestrator.yaml
  - app/agents/pm.yaml

skills:
  - app/skills/pm

actions:
  - app/actions/setup
  - app/actions/tick
  - app/actions/orchestrate
  - app/actions/run-worker
  - app/actions/create
  - app/actions/reply
  - app/actions/complete
  - app/actions/cancel
  - app/actions/snapshot
  - app/actions/ledger
  - app/actions/dispatch
  - app/actions/ask
  - app/actions/report
  - app/actions/wait
  - app/actions/close
  - app/actions/note
  - app/actions/stop

tagline: "Run long-lived tasks with a flexible playbook you can change anytime."
