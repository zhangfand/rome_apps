formatVersion: 2
id: conductor
name: Conductor
icon: assets/icon.svg
version: 0.1.0
description: >-
  A long-running task runner whose workflow is a prompt, not a state machine.
  A person or a labeled GitHub issue opens a task; an engineering lead reads
  the append-only ledger, brings in PM when product definition is
  needed, materializes runnable work, and owns delivery through ready-to-merge.
  Workers, people and external events all write to the same ledger.
appRoot: dist
includeSource: true

web:
  manifest: web/manifest.json
  displayName: Conductor
  navLabel: Conductor

api:
  entry: app/api/index

db:
  migrations: core/db/migrations
  tablePrefix: conductor

agents:
  - app/agents/conductor.yaml
  - app/agents/engineer-lead.yaml
  - app/agents/engineer-lead-replay-v1.yaml
  - app/agents/ledger-compactor.yaml
  - app/agents/pm.yaml
  - app/agents/coder.yaml
  - app/agents/assistant.yaml

skills:
  - app/skills/feasibility-prototype
  - app/skills/split-approved-prototype

hooks:
  - app/hooks/frontdesk-shadow

actions:
  - app/actions/setup
  - app/actions/tick
  - app/actions/orchestrate
  - app/actions/compact-task-history
  - app/actions/run-worker
  - app/actions/create
  - app/actions/fork-task
  - app/actions/reply
  - app/actions/complete
  - app/actions/cancel
  - app/actions/snapshot
  - app/actions/frontdesk-shadow-report
  - app/actions/ledger
  - app/actions/dispatch
  - app/actions/create-tasks
  - app/actions/ask
  - app/actions/report
  - app/actions/close
  - app/actions/ack
  - app/actions/stop

tagline: "Run long-lived tasks with a flexible playbook you can change anytime."
