formatVersion: 2
id: family-health
name: 家庭体检助手
version: 0.1.0
description: >-
  Family health-checkup tracker (UI in Simplified Chinese). Stores family
  members, uploaded checkup reports (PDF/photo), AI-extracted lab results and
  imaging findings, lifestyle interventions and home measurements; shows
  per-indicator trends and plain-language interpretations. Use its actions to
  list members, log an intervention or a home measurement (weight, blood
  pressure) from chat, end an intervention, or query a member's indicator
  history and abnormal results. All data stays on this machine.
tagline: 全家体检报告自动整理，指标趋势一目了然
icon: assets/icon.svg
appRoot: dist
includeSource: true

web:
  manifest: web/manifest.json
  displayName: 家庭体检助手
  navLabel: 家庭体检助手

api:
  entry: api/index

db:
  migrations: db/migrations
  tablePrefix: family_health
